[workspace]
resolver = "3"
members = ["crates/game", "crates/server", "crates/shared"]
default-members = ["crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
cosmic-shared = { path = "crates/shared" }

# Fast incremental builds: optimize deps, lightly optimize our code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
