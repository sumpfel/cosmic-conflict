[package]
name = "cosmic-conflict"
description = "Cosmic Conflict: a 3D real-time strategy game in space (game client)"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "cosmic-conflict"

[features]
default = ["dev"]
# Fast dev builds (dynamic linking); build releases with --no-default-features.
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "0.20.1", features = ["wayland"] }
bevy_egui = "0.43.1"
cc_core.workspace = true
cc_protocol.workspace = true
cc_server.workspace = true
serde.workspace = true
ron.workspace = true
crossbeam-channel.workspace = true
directories = "6"
rand = "0.9"
